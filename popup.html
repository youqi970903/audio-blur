<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Blur</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container disabled">
    <!-- Header -->
    <div class="header">
      <div class="logo-area">
        <img src="logo.png" alt="Audio blur" class="brand-logo">
      </div>
    </div>

    <!-- Power toggle -->
    <div class="control-section toggle-section">
      <div class="toggle-container">
        <span class="toggle-label" id="statusLabel" role="status">Loading…</span>
        <label class="switch">
          <input type="checkbox" id="enableToggle" aria-label="Audio blur for this tab" disabled>
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
        </label>
      </div>
    </div>

    <!-- Blur intensity — dark card -->
    <div class="dark-card">
      <div class="slider-header">
        <label class="slider-title" for="blurSlider">Blur Intensity</label>
        <span class="value-display" id="blurValue">85%</span>
      </div>
      <div class="slider-wrapper">
        <input 
          type="range" 
          id="blurSlider" 
          min="0" 
          max="100" 
          value="85" 
          class="blur-slider"
          disabled
        >
      </div>
      <div class="slider-marks">
        <span>Clear</span>
        <span>Moderate</span>
        <span>Heavy</span>
      </div>
    </div>

    <!-- Hint -->
    <div class="info-section">
      <div class="info-box">
        <div class="info-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="info-text" id="infoText" aria-live="polite">
          Turn on Audio Blur for this tab, then adjust the intensity as you listen.
        </p>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <a class="feedback-link" href="mailto:youqi9793@gmail.com?subject=Audio%20Blur%20Feedback">Any feedback? Let me know!</a>
    <span class="version" id="version">v1.0.1</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
